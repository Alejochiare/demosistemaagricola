<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroGestión · Sistema de Gestión Agrícola</title>
<meta name="description" content="Plataforma de gestión agrícola para el control de lotes, cultivos, siembras, fumigaciones, cosechas y notas operativas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5c3d'/%3E%3Cpath d='M9 22c0-7 5-12 12-13-1 8-5 12-12 13Z' fill='%237fd39c'/%3E%3Cpath d='M9 22c2-3 3-6 3-10' stroke='%23103622' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-gate" id="authGate">
  <form class="auth-card" id="authForm">
    <span class="auth-card__brand">
      <svg viewBox="0 0 32 32" width="30" height="30" fill="none"><rect width="32" height="32" rx="9" fill="#1f5c3d"/><path d="M9 23c0-7.5 5-13 13-14-1 8.6-5.4 13-13 14Z" fill="#7fd39c"/></svg>
      <strong>AgroGestión</strong>
    </span>
    <p class="auth-card__subtitle">Iniciá sesión para acceder al sistema</p>
    <label class="auth-card__field">
      <span>Email</span>
      <input type="email" id="authEmail" required autocomplete="username">
    </label>
    <label class="auth-card__field">
      <span>Contraseña</span>
      <input type="password" id="authPassword" required autocomplete="current-password">
    </label>
    <p class="auth-card__error" id="authError" hidden></p>
    <button type="submit" class="btn btn--primary auth-card__submit" id="authSubmit">Ingresar</button>
  </form>
</div>

<div class="app-shell">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 23c0-7.5 5-13 13-14-1 8.6-5.4 13-13 14Z" fill="#fff" fill-opacity=".92"/><path d="M9 23c2.2-3.2 3.3-6.5 3.3-10.6" stroke="#12351f" stroke-width="1.4" stroke-linecap="round"/></svg>
      </span>
      <div class="brand-text">
        <strong>AgroGestión</strong>
        <span>Panel de operaciones</span>
      </div>
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="section-switch" id="sectionSwitch"></div>
    <nav class="sidebar__nav" id="sidebarNav" aria-label="Navegación principal"></nav>

    <div class="sidebar__footer">
      <button class="theme-toggle" id="themeToggle" type="button">
        <span class="theme-toggle__icon" aria-hidden="true">
          <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </span>
        <span class="theme-toggle__label">Modo oscuro</span>
        <span class="theme-toggle__switch" aria-hidden="true"><span class="theme-toggle__dot"></span></span>
      </button>
      <div class="sidebar__meta">
        <span id="sidebarClock"></span>
        <button class="sidebar__signout" id="signOutBtn" type="button">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <button class="icon-btn sidebar-burger" id="sidebarBurger" type="button" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="topbar__title">
        <h1 id="viewTitle">Dashboard</h1>
        <p id="viewSubtitle">Resumen ejecutivo de la operación</p>
      </div>

      <div class="topbar__actions">
        <div class="global-search-wrap">
          <label class="global-search" for="globalSearch">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="globalSearch" type="search" placeholder="Buscar en todo el sistema…" autocomplete="off">
          </label>
          <div class="search-results" id="searchResults"></div>
        </div>
        <button class="btn btn--primary" id="quickAddBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="quick-add-label">Nuevo registro</span>
        </button>
      </div>
    </header>

    <main class="view-root" id="viewRoot" tabindex="-1"></main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContainer" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box" id="confirmBox" role="alertdialog" aria-modal="true"></div>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
